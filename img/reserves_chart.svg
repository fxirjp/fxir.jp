<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img"
 aria-label="日本の外貨準備の内訳。上段の証券は2023年1月から2026年7月にかけて9,650億ドル前後から10,300億ドル台まで増えたのち9,273億ドルへ減少。下段の預金は1,370億ドルから1,623億ドルへ緩やかに増加。円買い介入E3・E4・E5の決済月を縦線で示す。いずれの決済月も減っているのは証券であり預金ではない。">
<defs><pattern id="gr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0 L0 0 0 30" fill="none" stroke="#141a28" stroke-width="0.4" opacity="0.04"/></pattern>
<style>
.ja{font-family:"Noto Sans CJK JP","Noto Sans JP","Hiragino Sans",sans-serif}
.mono{font-family:"DejaVu Sans Mono",monospace}
.g{stroke:#141a28;stroke-width:.6;opacity:.14}
.ax{font-family:"DejaVu Sans Mono",monospace;font-size:12px;fill:#6b7280}
.ln{fill:none;stroke:#1F4468;stroke-width:2.2;stroke-linejoin:round}
.ln2{fill:none;stroke:#A63D2F;stroke-width:2.2;stroke-linejoin:round}
.ep{stroke:#141a28;stroke-width:1;stroke-dasharray:4 4;opacity:.34}
.epl{font-family:"DejaVu Sans Mono",monospace;font-size:12px;font-weight:700;fill:#141a28}
.lbl{font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;font-size:14.5px;font-weight:700}
</style></defs>
<rect width="1200" height="800" fill="#f7f5ee"/><rect width="1200" height="800" fill="url(#gr)"/>
<text class="mono" x="100" y="48" font-size="12" letter-spacing="3.6" fill="#6b7280">FXIR ・ OFFICIAL RESERVE ASSETS OF JAPAN</text>
<text class="ja" x="100" y="88" font-size="28" font-weight="700" fill="#141a28">当局は、外債を売って介入している</text>
<text class="ja" x="100" y="116" font-size="15" fill="#4a5a6a">外貨準備の内訳（月末・億ドル）— 円買い介入の決済月に減るのは証券であって、預金ではない</text>
