<text class="mono" x="1138.0" y="518.0" font-size="14" font-weight="700" text-anchor="end" fill="#A63D2F">1,623</text>
<line x1="100" y1="734" x2="1148" y2="734" stroke="#141a28" stroke-width="1" opacity=".18"/>
<text class="mono" x="100" y="756" font-size="11.5" letter-spacing="2.2" fill="#6b7280">FXIR.JP — DON'T TRUST, VERIFY.</text>
<text class="ja" x="1148" y="754" font-size="11" text-anchor="end" fill="#6b7280">出所: 財務省「外貨準備等の状況」月末値（2023年1月〜2026年7月・43か月）</text>
<text class="ja" x="1148" y="769" font-size="11" text-anchor="end" fill="#6b7280">E1・E2（2022年9-10月）は当該月ページを取得できず図から除外</text>
<text class="ja" x="1148" y="784" font-size="11" text-anchor="end" fill="#6b7280">E6（2026年7-8月）の決済は8月に入るため、反映は8月末値（9月7日頃公表）から</text>
</svg>